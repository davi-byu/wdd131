<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avaliação Enviada | Davi Victor</title>

    <meta name="description" content="Confirmação do envio da avaliação de produto desenvolvida para o curso WDD 131.">

    <meta name="author" content="Davi Victor">

    <link rel="stylesheet" href="estilos/form.css">
    <script src="scripts/avaliacao.js" defer></script>
</head>

<body>

    <header>
        <h1>Avaliação Enviada</h1>
    </header>

    <main>
        <section class="resultado">

            <h2>Obrigado pela sua avaliação!</h2>

            <p>
                Sua avaliação foi enviada com sucesso.
            </p>

            <div class="dados-avaliacao">

                <p>
                    <strong>Produto:</strong>
                    <span id="produto"></span>
                </p>

                <p>
                    <strong>Classificação:</strong>
                    <span id="classificacao"></span>
                </p>

                <p>
                    <strong>Data de instalação:</strong>
                    <span id="instalacao"></span>
                </p>

                <p>
                    <strong>Recursos:</strong>
                    <span id="recursos"></span>
                </p>

                <p>
                    <strong>Avaliação escrita:</strong>
                    <span id="comentario"></span>
                </p>

                <p>
                    <strong>Nome de usuário:</strong>
                    <span id="usuario"></span>
                </p>

            </div>

            <a class="botao" href="formulario.html">
                Fazer outra avaliação
            </a>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 🌴 Davi Victor 🌴 Brasil</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
