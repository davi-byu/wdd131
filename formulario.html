<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Revisão de Produto | Davi Victor</title>

    <meta name="description" content="Formulário de revisão de produtos desenvolvido por Davi Victor para o curso WDD 131.">

    <meta name="author" content="Davi Victor">

    <link rel="stylesheet" href="estilos/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Revisão de Produto</h1>
    </header>

    <main>

        <form method="get" action="avaliacao.html">

            <div class="campo">
                <label for="produto">Nome do Produto <span>*</span></label>

                <select id="produto" name="produto" required>
                    <option value="" disabled selected>
                        Selecione um Produto...
                    </option>
                </select>
            </div>

            <fieldset class="campo">
                <legend>Classificação Geral <span>*</span></legend>

                <div class="classificacao">

                    <input type="radio" id="estrela1" name="classificacao" value="1" required>
                    <label for="estrela1">☆</label>

                    <input type="radio" id="estrela2" name="classificacao" value="2" required>
                    <label for="estrela2">☆☆</label>

                    <input type="radio" id="estrela3" name="classificacao" value="3" required>
                    <label for="estrela3">☆☆☆</label>

                    <input type="radio" id="estrela4" name="classificacao" value="4" required>
                    <label for="estrela4">☆☆☆☆</label>

                    <input type="radio" id="estrela5" name="classificacao" value="5" required>
                    <label for="estrela5">☆☆☆☆☆</label>

                </div>
            </fieldset>

            <div class="campo">
                <label for="instalacao">Data de Instalação <span>*</span></label>

                <input type="date" id="instalacao" name="instalacao" required>
            </div>

            <fieldset class="campo">
                <legend>Recursos Úteis</legend>

                <div class="checkbox-item">
                    <input type="checkbox" id="durabilidade" name="recursos" value="Durabilidade">
                    <label for="durabilidade">Durabilidade</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="facilidade" name="recursos" value="Facilidade de uso">
                    <label for="facilidade">Facilidade de uso</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="desempenho" name="recursos" value="Desempenho">
                    <label for="desempenho">Desempenho</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="design" name="recursos" value="Design">
                    <label for="design">Design</label>
                </div>

            </fieldset>

            <div class="campo">
                <label for="comentario">Avaliação Escrita</label>

                <textarea id="comentario" name="comentario" rows="5" placeholder="Escreva sua avaliação..."></textarea>
            </div>

            <div class="campo">
                <label for="usuario">Nome de Usuário</label>

                <input type="text" id="usuario" name="usuario" autocomplete="name">
            </div>

            <input class="botao" type="submit" value="Publicar Avaliação">

        </form>

    </main>

    <footer>
        <p>&copy; 2026 🌴 Davi Victor 🌴 Brasil</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
